<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inkmath tags and custom toolbar</title>
<link rel="stylesheet" href="../dist/inkmath.css">
<style>
  body { margin: 0; background: #f3f5f1; color: #1d2b4a; font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 60px; display: grid; gap: 18px; }
  h2 { font-size: 15px; margin: 8px 0 0; }
  ink-math-toolbar { position: sticky; top: 0; z-index: 5; background: #f3f5f1; padding-top: 8px; }
  /* a custom toolbar in the host app's own style */
  .mybar { display: flex; gap: 4px; padding: 6px; background: #1d2b4a; border-radius: 10px; }
  .mybar button { width: 46px; height: 40px; border: 0; border-radius: 6px; background: transparent; color: #e6eadf; font-size: 18px; cursor: pointer; }
  .mybar button:hover:not(:disabled) { background: #2f6f4f; }
  .mybar button:disabled { opacity: .35; cursor: default; }
  .mybar .inkmath-icon { color: #e6eadf; }
  #log { font: 13px Consolas, monospace; color: #5d6b63; }
</style>
</head>
<body>
<main>
  <h2>One shared toolbar (Chinese), two fields</h2>
  <ink-math-toolbar id="shared" locale="zh"></ink-math-toolbar>
  <ink-math id="a" toolbar="none">\frac{a}{b}</ink-math>
  <ink-math id="b" toolbar="none" font="kalam" value="x^{2}+1"></ink-math>

  <h2>A custom toolbar built on the editor API</h2>
  <div class="mybar" id="mybar"></div>
  <ink-math id="c" toolbar="none" value="\sqrt{x}"></ink-math>
  <div id="log"></div>
</main>

<script type="module">
import '../dist/inkmath.bundle.js';

const c = document.getElementById('c');
const editor = await c.ready;
const bar = document.getElementById('mybar');
const buttons = [
  ['\\frac{#@}{#?}'], ['\\sqrt{#@}'], ['#@^{#?}'], ['\\int_{#?}^{#?}#@'], ['\\alpha'],
  ['undo', 'cmd', '↶', (x) => x.canUndo], ['redo', 'cmd', '↷', (x) => x.canRedo],
  ['addRowAfter', 'cmd', '+row', (x) => x.inMatrix],
];
const live = [];
for (const [what, kind, text, enabled] of buttons) {
  const b = document.createElement('button');
  b.onmousedown = (e) => e.preventDefault();          // keep the caret in the field
  if (kind === 'cmd') { b.textContent = text; b.onclick = () => editor.command(what); }
  else { b.innerHTML = editor.renderIcon(what); b.onclick = () => editor.insert(what); }
  if (enabled) live.push([b, enabled]);
  bar.appendChild(b);
}
const refresh = (ctx) => { for (const [b, ok] of live) b.disabled = !ok(ctx); };
editor.on('context', refresh);
refresh(editor.getContext());

const log = document.getElementById('log');
document.addEventListener('change', (e) => { if (e.target.localName === 'ink-math') log.textContent = `${e.target.id}: ${e.detail.value}`; });
await Promise.all([...document.querySelectorAll('ink-math')].map((el) => el.ready));
window.__ready = true;
</script>
</body>
</html>
